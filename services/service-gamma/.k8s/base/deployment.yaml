# Workload example
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-gamma
  namespace: service-gamma
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-gamma }
  template:
    metadata:
      labels: { app: service-gamma }
    spec:
      serviceAccountName: service-gamma
      # Opt-in node group "batch" (platform/.tf/mx.tfvars): label + toleration of its taint.
      nodeSelector:
        platform.example.org/node-group: batch
      tolerations:
        - key: platform.example.org/node-group
          operator: Equal
          value: batch
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: COUNTRY, value: set-by-overlay }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: service-gamma
  namespace: service-gamma
spec:
  selector: { app: service-gamma }
  ports: [{ name: http, port: 80, targetPort: http }]
