apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: service-gamma
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Allowed callers: only pods of the same namespace (service-gamma is a batch worker, nobody calls it)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clients
  namespace: service-gamma
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
