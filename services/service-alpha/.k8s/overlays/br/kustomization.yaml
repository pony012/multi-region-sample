apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# service-alpha in cluster shared-br:  kubectl --context <shared-br> apply -k .k8s/overlays/br
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: service-alpha }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "br"
