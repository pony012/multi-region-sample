# Workload example
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-alpha
  namespace: service-alpha
spec:
  replicas: 2
  selector:
    matchLabels: { app: service-alpha }
  template:
    metadata:
      labels: { app: service-alpha }
    spec:
      serviceAccountName: service-alpha
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: COUNTRY, value: set-by-overlay }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: service-alpha
  namespace: service-alpha
spec:
  selector: { app: service-alpha }
  ports: [{ name: http, port: 80, targetPort: http }]
