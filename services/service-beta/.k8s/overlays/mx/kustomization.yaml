apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# service-beta in cluster shared-mx:  kubectl --context <shared-mx> apply -k .k8s/overlays/mx
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: service-beta }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "mx"
